version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: emr_postgres_db
    restart: always
    environment:
      POSTGRES_DB: oscar_emr
      POSTGRES_USER: emr_admin
      POSTGRES_PASSWORD: emr_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_emr_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emr_backend_api
    restart: always
    ports:
      - "8085:8085"
    depends_on:
      - db
    environment:
      - DB_URL=jdbc:postgresql://db:5432/oscar_emr
      - DB_USERNAME=emr_admin
      - DB_PASSWORD=emr_secure_password
      - JWT_SECRET=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
      - SERVER_PORT=8085

volumes:
  postgres_emr_data:
